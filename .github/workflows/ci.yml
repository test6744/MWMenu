name: CI

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: windows-2022
    name: CI
    steps:
      - uses: actions/checkout@v4

      - name: Check CMake version
        run: cmake --version

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Generate CMake project
        run: cmake -D CMAKE_BUILD_TYPE=RelWithDebInfo -D OPTIMIZE=YES -D CMAKE_POLICY_VERSION_MINIMUM=3.5 -S. -Bbuild -G Ninja

      - name: Build 64bit release DLL
        run: cmake --build ./build --config RelWithDebInfo --target YimMenu --

      - name: Check if DLL got built
        run: if (-Not (Test-Path -path "build/YimMenu.dll")) {throw 1}
        
      - name: Stage debugging DLLs via Visual Studio SDK
        shell: cmd
        run: |
          @echo off
          
          :: 1. Extract values directly from runner's pre-initialized environment
          if "%WindowsSdkDir%"=="" (
              set "SDK_DIR=C:\Program Files (x86)\Windows Kits\10"
              set "SDK_VER=10.0.26100.0"
          ) else (
              set "SDK_DIR=%WindowsSdkDir%"
              set "SDK_VER=%WindowsSDKVersion%"
          )
          
          :: Strip trailing backslashes if present
          if "%SDK_DIR:~-1%"=="\" set "SDK_DIR=%SDK_DIR:~0,-1%"
          if "%SDK_VER:~-1%"=="\" set "SDK_VER=%SDK_VER:~0,-1%"
          
          :: 2. Target the architecture folder layout
          set "DEBUGGERS_DIR=%SDK_DIR%\Debuggers\x64"
          if not exist "%DEBUGGERS_DIR%\dbghelp.dll" (
              set "DEBUGGERS_DIR=%SDK_DIR%\Debuggers\%SDK_VER%\x64"
          )
          
          echo Copying debugging DLLs from: %DEBUGGERS_DIR%
          
          :: 3. Define explicit workspace target paths matching CMakeSettings layouts
          :: (We create and copy to both possible Ninja configuration roots)
          set "TARGET_RELEASE=%GITHUB_WORKSPACE%\build\x64-Release"
          set "TARGET_DEBUG=%GITHUB_WORKSPACE%\build\x64-Debug-Dev"
          
          if not exist "%TARGET_RELEASE%" mkdir "%TARGET_RELEASE%"
          if not exist "%TARGET_DEBUG%" mkdir "%TARGET_DEBUG%"
          
          :: 4. Securely copy files to destinations
          xcopy "%DEBUGGERS_DIR%\dbghelp.dll" "%TARGET_RELEASE%\" /Y /R /F
          xcopy "%DEBUGGERS_DIR%\symsrv.dll" "%TARGET_RELEASE%\" /Y /R /F
          
          xcopy "%DEBUGGERS_DIR%\dbghelp.dll" "%TARGET_DEBUG%\" /Y /R /F
          xcopy "%DEBUGGERS_DIR%\symsrv.dll" "%TARGET_DEBUG%\" /Y /R /F

      - name: Rename DLL to YimMenu-dev-{GITHUB_SHA}.dll
        run: |
          del YimMenu-dev-*.dll
          del YimMenu-dev-*.pdb
          ren YimMenu.dll YimMenu-dev-${{github.sha}}.dll
          ren YimMenu.pdb YimMenu.pdb
        working-directory: build/

      - name: Upload Artifact (dll)
        uses: actions/upload-artifact@v4
        with:
          name: binary
          path: |
            build/YimMenu-dev-*.dll
            build/dbghelp.dll
            build/symsrv.dll
            
      - name: Upload Artifact (pdb)
        uses: actions/upload-artifact@v4
        with:
          name: pdb
          path: |
            build/YimMenu.pdb
