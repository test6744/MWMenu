name: CI

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: windows-2022
    name: CI
    steps:
      - uses: actions/checkout@v4

      - name: Check CMake version
        run: cmake --version

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Generate CMake project
        run: cmake -D CMAKE_BUILD_TYPE=RelWithDebInfo -D OPTIMIZE=YES -D CMAKE_POLICY_VERSION_MINIMUM=3.5 -S. -Bbuild -G Ninja

      - name: Build 64bit release DLL
        run: cmake --build ./build --config RelWithDebInfo --target YimMenu --

      - name: Check if DLL got built
        run: if (-Not (Test-Path -path "build/YimMenu.dll")) {throw 1}
        
      - name: Stage debugging DLLs via Visual Studio SDK
        run: |
          # Run vcvarsall to get the SDK path, then find and copy the files
          cmd.exe /c "call 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat' x64 && set" | ForEach-Object {
              if ($_ -match '^WindowsSdkDir=(.*)$') { $script:sdkDir = $Matches[1].Trim() }
              if ($_ -match '^WindowsSDKVersion=(.*)$') { $script:sdkVer = $Matches[1].Trim() }
          }
          
          $sdkDebuggersX64 = Join-Path $script:sdkDir "Debuggers\x64"
          
          # If not found in root Debuggers folder, check the versioned subfolder
          if (-not (Test-Path (Join-Path $sdkDebuggersX64 "dbghelp.dll"))) {
              $sdkDebuggersX64 = Join-Path $script:sdkDir "Debuggers\$script:sdkVer\x64"
          }

          Write-Host "Copying debugging DLLs from: $sdkDebuggersX64"
          Copy-Item "$sdkDebuggersX64\dbghelp.dll" -Destination "build\" -Force
          Copy-Item "$sdkDebuggersX64\symsrv.dll" -Destination "build\" -Force
        shell: powershell

      - name: Rename DLL to YimMenu-dev-{GITHUB_SHA}.dll
        run: |
          del YimMenu-dev-*.dll
          del YimMenu-dev-*.pdb
          ren YimMenu.dll YimMenu-dev-${{github.sha}}.dll
          ren YimMenu.pdb YimMenu.pdb
        working-directory: build/

      - name: Upload Artifact (dll)
        uses: actions/upload-artifact@v4
        with:
          name: binary
          path: |
            build/YimMenu-dev-*.dll
            build/dbghelp.dll
            build/symsrv.dll
            
      - name: Upload Artifact (pdb)
        uses: actions/upload-artifact@v4
        with:
          name: pdb
          path: |
            build/YimMenu.pdb
